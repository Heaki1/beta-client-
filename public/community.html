<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>osu!dz Community </title>
  <link rel="stylesheet" href="Bountiestyl.css" />
  <style>
    /* Specific styles for the community grid */
    .beatmap-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
      margin-top: 2rem;
    }
    
    .filter-bar {
      margin-bottom: 2rem;
      padding: 1rem;
      background: #2a2a2a;
      border-radius: 8px;
      display: flex;
      gap: 10px;
    }

    .filter-btn {
      background: #333;
      border: 1px solid #444;
      color: white;
      padding: 5px 15px;
      border-radius: 20px;
      cursor: pointer;
    }

    .filter-btn.active {
      background: #ff66aa;
      border-color: #ff66aa;
    }
  </style>
</head>
<body>
  <nav>
    <a href="/">💰 Submit Bounties</a>
    <a href="/vote">🗳️ Vote</a>
    <a href="/admin">📝 Mappool Suggestions</a>
    <a href="/community" class="active">💬 Community</a>
  </nav>

  <div class="container">
    <div class="header">
      <h1>Community</h1>
      <p>Up/down vote and discuss submitted beatmaps. The monthly ballot lives on <a href="/vote">Vote</a>.</p>
    </div>

    <div class="filter-bar">
      <button class="filter-btn active" onclick="filterMaps(event, 'all')">All</button>
      <button class="filter-btn" onclick="filterMaps(event, 'bounty')">Bounties</button>
      <button class="filter-btn" onclick="filterMaps(event, 'suggestion')">Suggestions</button>
    </div>

    <div id="beatmap-grid" class="beatmap-grid">
      <div style="text-align:center; width:100%; color:#888;">Loading maps...</div>
    </div>
  </div>

  <div id="user-registration-modal">
    <div class="modal-content">
      <h2>👋 Welcome!</h2>
      <p>Please enter a display name to vote.</p>
      <form id="registration-form">
        <input type="text" id="username-input" placeholder="Username" required minlength="3" maxlength="20" autocomplete="off">
        <br>
        <button type="submit">Start Voting</button>
      </form>
    </div>
  </div>

  <script>
    let allMaps = [];
    const currentUserId = localStorage.getItem('act_user_id');

    // Comments, display names and beatmap titles are written by other people
    // and go into innerHTML below, so they're escaped first — otherwise a
    // comment of `<img src=x onerror=...>` runs for everyone who opens it.
    function esc(x) {
      return (x === null || x === undefined ? "" : String(x))
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    // Absolute http(s) only: escaping can't stop `javascript:alert(1)`, which
    // contains no characters worth escaping.
    function safeUrl(x) {
      const raw = (x === null || x === undefined ? "" : String(x)).trim();
      if (!raw) return "";
      try {
        const parsed = new URL(raw);
        if (parsed.protocol !== "http:" && parsed.protocol !== "https:") return "";
        return esc(parsed.href);
      } catch {
        return "";
      }
    }

    // 1. Fetch Maps on Load
    document.addEventListener('DOMContentLoaded', async () => {
      checkUser();
      await loadMaps();
    });

    function checkUser() {
      if (!currentUserId) {
        document.getElementById('user-registration-modal').style.display = 'flex';
      }
      
      // Handle Registration
      document.getElementById('registration-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const username = document.getElementById('username-input').value;
        try {
          const res = await fetch('/api/users/register', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ display_name: username })
          });
          const data = await res.json();
          if (res.ok) {
            localStorage.setItem('act_user_id', data.id);
            localStorage.setItem('act_username', data.display_name);
            location.reload();
          } else {
            // Silently doing nothing here made a rejected name look like a
            // broken button.
            alert(data.error || 'Registration failed');
          }
        } catch(err) { alert('Error registering'); }
      });
    }

    async function loadMaps() {
      try {
        const res = await fetch('/api/beatmaps/list');
        allMaps = await res.json();
        renderMaps(allMaps);
      } catch (err) {
        console.error(err);
        document.getElementById('beatmap-grid').innerHTML = '<p>Error loading maps.</p>';
      }
    }

    function renderMaps(maps) {
      const grid = document.getElementById('beatmap-grid');
      grid.innerHTML = '';

      if (maps.length === 0) {
        grid.innerHTML = '<p>No maps found.</p>';
        return;
      }

      maps.forEach(map => {
        const card = document.createElement('div');
        card.className = 'beatmap-card';
        const cover = safeUrl(map.cover_url);
        const mapUrl = safeUrl(map.url);
        card.innerHTML = `
          ${cover ? `<img src="${cover}" class="cover-image">` : ''}
          <div class="beatmap-header">
            <div><strong>${esc(map.title)}</strong></div>
            <div style="font-size:0.8rem; color:#aaa;">${esc(map.mod || 'NM')} | ${esc(map.stars ?? 'N/A')}⭐</div>
          </div>

          <div style="margin: 10px 0; font-size: 0.9rem;">
            ${map.skill ? `🎯 ${esc(map.skill)}` : ''}
          </div>

          <div class="vote-container" id="vote-box-${map.id}">
             <button class="vote-btn upvote" onclick="handleVote(${map.id}, 'upvote')">
               🔼 <span class="count">...</span>
             </button>
             <button class="vote-btn downvote" onclick="handleVote(${map.id}, 'downvote')">
               🔽 <span class="count">...</span>
             </button>
          </div>

          <div class="beatmap-actions" style="margin-top:10px; border-top:1px solid #333; padding-top:10px;">
             <button class="btn-small" onclick="toggleComments(${map.id})">💬 Comments</button>
             ${mapUrl ? `<a href="${mapUrl}" target="_blank" rel="noopener noreferrer" class="btn-small" style="text-decoration:none;">⬇️ osu!</a>` : ''}
          </div>

          <div id="comments-${map.id}" class="comments-section">
             <div class="comments-list" id="list-${map.id}">Loading...</div>
             <form class="comment-form" onsubmit="postComment(event, ${map.id})">
                <input type="text" class="comment-input" placeholder="Write a comment..." maxlength="500" required>
                <button type="submit" class="comment-submit">➤</button>
             </form>
          </div>
        `;
        
        grid.appendChild(card);
        fetchVotes(map.id);
      });
    }

    // --- Voting Logic ---
    async function fetchVotes(id) {
        try {
            // Guests see the tallies too — bailing out when nobody is signed in
            // left every card reading "🔼 ... 🔽 ..." forever.
            const query = currentUserId ? `?user_id=${encodeURIComponent(currentUserId)}` : '';
            const res = await fetch(`/api/beatmaps/${id}/votes${query}`);
            if (!res.ok) return;
            const data = await res.json();

            const box = document.getElementById(`vote-box-${id}`);
            if (!box) return;

            const upBtn = box.querySelector('.upvote');
            const downBtn = box.querySelector('.downvote');

            upBtn.querySelector('.count').innerText = data.upvotes;
            downBtn.querySelector('.count').innerText = data.downvotes;

            upBtn.classList.remove('active');
            downBtn.classList.remove('active');

            if (data.user_vote === 'upvote') upBtn.classList.add('active');
            if (data.user_vote === 'downvote') downBtn.classList.add('active');
        } catch (e) { console.error(e); }
    }

    async function handleVote(id, type) {
        if (!currentUserId) return alert("Please register first!");
        try {
            const res = await fetch(`/api/beatmaps/${id}/vote`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user_id: currentUserId, vote_type: type })
            });
            if (res.ok) {
                fetchVotes(id);
            } else {
                // Rate limits and unknown-user errors were swallowed here, so a
                // refused vote looked identical to a counted one.
                const data = await res.json().catch(() => ({}));
                alert(data.error || "Failed to vote");
            }
        } catch (e) { alert("Failed to vote"); }
    }

    // --- Filtering Logic ---
    // The event is passed in rather than read off the global `window.event`,
    // which only exists in some browsers and is deprecated in all of them.
    function filterMaps(evt, type) {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      if (evt?.currentTarget) evt.currentTarget.classList.add('active');

      if (type === 'all') {
        renderMaps(allMaps);
      } else {
        const filtered = allMaps.filter(m => m.type === type);
        renderMaps(filtered);
      }
    }
    // --- Comments Logic ---
    function toggleComments(id) {
      const section = document.getElementById(`comments-${id}`);
      const isHidden = section.style.display === 'none' || section.style.display === '';
      
      section.style.display = isHidden ? 'block' : 'none';
      
      if (isHidden) {
        loadComments(id);
      }
    }

    async function loadComments(id) {
      const list = document.getElementById(`list-${id}`);
      try {
        const res = await fetch(`/api/beatmaps/${id}/comments`);
        const comments = await res.json();
        
        if (comments.length === 0) {
          list.innerHTML = '<div style="color:#666; font-style:italic;">No comments yet.</div>';
          return;
        }

        list.innerHTML = comments.map(c => `
          <div class="comment">
            <div class="comment-author">${esc(c.display_name || 'Unknown')}</div>
            <div class="comment-text">${esc(c.comment_text)}</div>
          </div>
        `).join('');
      } catch (err) {
        list.innerHTML = 'Error loading comments.';
      }
    }

    async function postComment(e, id) {
      e.preventDefault();
      if (!currentUserId) return alert("Please register first!");

      const input = e.target.querySelector('input');
      const text = input.value;
      const username = localStorage.getItem('act_username') || 'Anon';

      try {
        const res = await fetch(`/api/beatmaps/${id}/comments`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ 
            user_id: currentUserId,
            display_name: username,
            comment_text: text
          })
        });

        if (res.ok) {
          input.value = ''; // Clear input
          loadComments(id); // Reload list
        } else {
          // The server explains itself now ("Please reword that comment",
          // "Unknown user — please register again"), so show that instead of
          // a flat "Failed to post".
          const data = await res.json().catch(() => ({}));
          alert(data.error || "Failed to post");
        }
      } catch (err) { console.error(err); }
    }
  </script>
</body>
</html>
